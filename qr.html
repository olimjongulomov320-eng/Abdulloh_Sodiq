<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code — Abdulloh Sodiq</title>
    <meta name="description" content="Scan to open abdullohsodiq.uz">
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1.25rem;
        }

        .qr-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        }

        .qr-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 0.3rem;
        }

        .qr-subtitle {
            font-size: 0.78rem;
            color: var(--emerald);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1.75rem;
        }

        .qr-divider {
            width: 40px;
            height: 2px;
            background: var(--emerald);
            margin: 0 auto 1.75rem;
            border-radius: 2px;
        }

        .qr-frame {
            background: #ffffff;
            border-radius: 4px;
            padding: 14px;
            display: block;
            width: 100%;
            max-width: 260px;
            margin: 0 auto 1.5rem;
        }

        .qr-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .qr-url {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-white);
            word-break: break-all;
            margin-bottom: 0.4rem;
        }

        .qr-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.75rem;
        }

        .qr-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 44px;
            padding: 0.7rem 1.5rem;
            background: var(--emerald);
            color: #080c0c;
            border-radius: 2px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--emerald);
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
        }

        .qr-btn:hover {
            background: var(--emerald-glow);
            border-color: var(--emerald-glow);
            box-shadow: 0 0 24px rgba(0, 184, 148, 0.35);
        }

        .qr-btn-ghost {
            background: transparent;
            color: var(--emerald);
            border-color: var(--border-bright);
        }

        .qr-btn-ghost:hover {
            background: rgba(0, 184, 148, 0.08);
            color: var(--emerald);
            border-color: var(--emerald);
        }

        .qr-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 44px;
            margin-top: 1.25rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .qr-back:hover { color: var(--emerald); }

        @media (max-width: 480px) {
            .qr-wrapper { padding: 2rem 1.5rem; }
            .qr-logo { font-size: 1.35rem; }
            .qr-frame { max-width: 220px; }
        }

        @media print {
            body { background: #ffffff; padding: 0; }
            .qr-wrapper {
                background: #ffffff;
                border: 1px solid #cccccc;
                box-shadow: none;
                max-width: 100%;
            }
            .qr-logo { color: #080c0c; }
            .qr-subtitle { color: #007a63; }
            .qr-url { color: #080c0c; }
            .qr-hint, .qr-actions, .qr-back { display: none; }
        }
    </style>
</head>
<body>
    <main>
        <div class="qr-wrapper">
            <div class="qr-logo">Abdulloh Sodiq</div>
            <div class="qr-subtitle">Attorney at Law · Tashkent</div>
            <div class="qr-divider"></div>

            <a class="qr-frame" href="https://abdullohsodiq.uz/" aria-label="Open abdullohsodiq.uz">
                <img class="qr-image" src="qr-code.png" width="900" height="900"
                     alt="QR code linking to https://abdullohsodiq.uz/" decoding="async">
            </a>

            <div class="qr-url">abdullohsodiq.uz</div>
            <div class="qr-hint">Scan to visit the website</div>

            <div class="qr-actions">
                <a class="qr-btn" href="https://abdullohsodiq.uz/" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-external-link-alt"></i> Open Site
                </a>
                <button class="qr-btn qr-btn-ghost" type="button" onclick="window.print()">
                    <i class="fas fa-print"></i> Print / Save
                </button>
            </div>

            <a class="qr-back" href="index.html"><i class="fas fa-arrow-left"></i> Back to website</a>
        </div>
    </main>
</body>
</html>
